apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ecoguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ecoguard/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4321
          env:
            - name: PUBLIC_TWITTER_SERVICE_URL
              value: "http://twitter-service:8000"
          livenessProbe:
            tcpSocket:
              port: 4321
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 4321
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ecoguard
spec:
  selector:
    app: frontend
  ports:
    - port: 4321
      targetPort: 4321
      nodePort: 30401
  type: NodePort
