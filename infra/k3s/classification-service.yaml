apiVersion: apps/v1
kind: Deployment
metadata:
  name: classification-service
  namespace: ecoguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: classification-service
  template:
    metadata:
      labels:
        app: classification-service
    spec:
      containers:
        - name: classification
          image: ecoguard/classification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
            - containerPort: 50053
          env:
            - name: FLASK_PORT
              value: "8083"
            - name: GRPC_PORT
              value: "50053"
            - name: MODEL_PATH
              value: "models/model.onnx"
            - name: LABELS_PATH
              value: "features/classifier/labels.json"
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
---
apiVersion: v1
kind: Service
metadata:
  name: classification-service
  namespace: ecoguard
spec:
  selector:
    app: classification-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
    - name: grpc
      port: 50053
      targetPort: 50053
