apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockchain-service
  namespace: ecoguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blockchain-service
  template:
    metadata:
      labels:
        app: blockchain-service
    spec:
      containers:
        - name: blockchain-service
          image: ecoguard/blockchain-service:latest
          ports:
            - containerPort: 50056
          env:
            - name: GRPC_PORT
              value: "50056"
            - name: MONGODB_URI
              value: "mongodb://mongodb:27017"
            - name: BLOCKCHAIN_DB
              value: "ecoguard_blockchain"
            - name: POW_DIFFICULTY
              value: "4"
          livenessProbe:
            tcpSocket:
              port: 50056
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 50056
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: blockchain-service
  namespace: ecoguard
spec:
  selector:
    app: blockchain-service
  ports:
    - protocol: TCP
      port: 50056
      targetPort: 50056
  type: ClusterIP
