apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ecoguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification
          image: ecoguard/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50054
          env:
            - name: DATABASE_URL
              value: postgres://ecoguard:ecoguard123@pgbouncer:5432/ecoguard_notification
            - name: RABBITMQ_URI
              value: amqp://guest:guest@rabbitmq:5672
          readinessProbe:
            tcpSocket:
              port: 50054
          livenessProbe:
            tcpSocket:
              port: 50054
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ecoguard
spec:
  selector:
    app: notification-service
  ports:
    - port: 50054
      targetPort: 50054
