apiVersion: apps/v1
kind: Deployment
metadata:
  name: nlp-service
  namespace: ecoguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nlp-service
  template:
    metadata:
      labels:
        app: nlp-service
    spec:
      containers:
        - name: nlp-service
          image: ecoguard/nlp-service:latest
          ports:
            - containerPort: 50055
          env:
            - name: GRPC_PORT
              value: "50055"
          livenessProbe:
            tcpSocket:
              port: 50055
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 50055
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nlp-service
  namespace: ecoguard
spec:
  selector:
    app: nlp-service
  ports:
    - protocol: TCP
      port: 50055
      targetPort: 50055
  type: ClusterIP
