apiVersion: apps/v1
kind: Deployment
metadata:
  name: twitter-service
  namespace: ecoguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twitter-service
  template:
    metadata:
      labels:
        app: twitter-service
    spec:
      containers:
        - name: twitter
          image: ecoguard/twitter-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50052
            - containerPort: 8000
          env:
            - name: MONGO_URI
              value: mongodb://mongo-twitter:27017/ecoguard_twitter
            - name: RABBITMQ_URI
              value: amqp://guest:guest@rabbitmq:5672
            - name: CLASSIFICATION_GRPC_ADDR
              value: classification-service:50053
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: twitter-service
  namespace: ecoguard
spec:
  selector:
    app: twitter-service
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052
    - name: http
      port: 8000
      targetPort: 8000
