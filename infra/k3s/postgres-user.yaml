apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-user
  namespace: ecoguard
spec:
  serviceName: postgres-user
  replicas: 1
  selector:
    matchLabels:
      app: postgres-user
  template:
    metadata:
      labels:
        app: postgres-user
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: ecoguard_user
            - name: POSTGRES_USER
              value: ecoguard
            - name: POSTGRES_PASSWORD
              value: ecoguard123
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-user
  namespace: ecoguard
spec:
  selector:
    app: postgres-user
  ports:
    - port: 5432
      targetPort: 5432
