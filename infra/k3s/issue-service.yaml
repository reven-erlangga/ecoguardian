apiVersion: apps/v1
kind: Deployment
metadata:
  name: issue-service
  namespace: ecoguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: issue-service
  template:
    metadata:
      labels:
        app: issue-service
    spec:
      containers:
        - name: issue
          image: ecoguard/issue-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50057
          env:
            - name: GRPC_PORT
              value: "50057"
            - name: MONGODB_URI
              value: "mongodb://mongo-twitter:27017"
          livenessProbe:
            tcpSocket:
              port: 50057
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 50057
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: issue-service
  namespace: ecoguard
spec:
  selector:
    app: issue-service
  ports:
    - name: grpc
      port: 50057
      targetPort: 50057
