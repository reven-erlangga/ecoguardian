[databases]
ecoguard_user = host=postgres-user port=5432 dbname=ecoguard_user
ecoguard_notif = host=postgres-notif port=5432 dbname=ecoguard_notif

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 20
max_client_conn = 100
server_idle_timeout = 300
client_idle_timeout = 600
log_connections = 1
log_disconnections = 1
