syntax = "proto3";

package common;

option go_package = "github.com/ecoguard/protobuf/common";

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

message Pagination {
  int32 page = 1;
  int32 per_page = 2;
}

message PaginationResponse {
  int32 page = 1;
  int32 per_page = 2;
  int32 total = 3;
}

message Empty {}

message Error {
  string code = 1;
  string message = 2;
}
