syntax = "proto3";

package user;

option go_package = "github.com/ecoguard/protobuf/user";

import "common/common.proto";

message User {
  string id = 1;
  string email = 2;
  string username = 3;
  string role = 4;
  common.Timestamp created_at = 5;
  common.Timestamp updated_at = 6;
}

message RegisterRequest {
  string email = 1;
  string username = 2;
  string password = 3;
}

message RegisterResponse {
  User user = 1;
  string token = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  User user = 1;
  string token = 2;
}

message GetUserRequest {
  string id = 1;
}

message UpdateUserRequest {
  string id = 1;
  string email = 2;
  string username = 3;
}
