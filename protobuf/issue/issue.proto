syntax = "proto3";

package issue;

option go_package = "github.com/ecoguard/protobuf/issue";

import "common/common.proto";

message Location {
  double lat = 1;
  double lon = 2;
  string address = 3;
}

message Issue {
  string id = 1;
  string tweet_id = 2;
  string type = 3;             // e.g. "fallen_tree", "garbage", "vandalism"
  float confidence = 4;
  string status = 5;           // "open", "resolved"
  Location location = 6;
  string paraphrased_text = 7;
  Resolution resolution = 8;
  repeated string image_hashes = 9;
  int64 created_at = 10;
  int64 resolved_at = 11;
}

message Resolution {
  string admin_id = 1;
  string notes = 2;
  repeated string image_hashes = 3;
  int64 resolved_at = 4;
}

message Cluster {
  string address = 1;
  double lat = 2;
  double lon = 3;
  int32 issue_count = 4;
  repeated string types = 5;
}
